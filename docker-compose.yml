services:
  scarfvault:
    build: .
    container_name: scarfvault
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Persists the SQLite database and all uploaded photos
      # across container rebuilds and updates
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
